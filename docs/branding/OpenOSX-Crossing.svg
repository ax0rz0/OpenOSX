<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>OpenOSX — Crossing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B36"/><stop offset="1" stop-color="#06070F"/>
    </linearGradient>
    <linearGradient id="rib1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E6CFF"/><stop offset="1" stop-color="#3E5BEF"/>
    </linearGradient>
    <linearGradient id="rib2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BF2E0"/><stop offset="1" stop-color="#23A8E8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#2E3F86"/><stop offset="1" stop-color="#1B2A63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6C8CFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6C8CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="44" y="44" width="424" height="424" rx="104"/></clipPath>
  </defs>

  <rect x="44" y="44" width="424" height="424" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="44" y="44" width="424" height="424" fill="url(#glow)"/>

    <!-- deep swell, sets the horizon -->
    <path d="M28,382 C120,344 190,344 256,376 C322,410 394,410 484,372 L484,484 L28,484 Z" fill="url(#base)" opacity="0.85"/>

    <!-- two wave ribbons crossing: the X, drawn as motion rather than a letterform -->
    <path d="M96,150 C168,150 200,236 256,268 C312,300 350,336 416,336"
          fill="none" stroke="url(#rib1)" stroke-width="44" stroke-linecap="round"/>
    <path d="M416,150 C344,150 312,236 256,268 C200,300 162,336 96,336"
          fill="none" stroke="url(#rib2)" stroke-width="44" stroke-linecap="round"/>

    <!-- crest highlight on the near ribbon -->
    <path d="M416,150 C344,150 312,236 256,268 C200,300 162,336 96,336"
          fill="none" stroke="#EAFFFB" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="44.75" y="44.75" width="422.5" height="422.5" rx="103.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
